<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Screenshot Tool</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>📚 Kindle Screenshot</h1>

    <!-- ステータス表示エリア -->
    <div id="status" class="status hidden"></div>

    <!-- キャプチャ機能 -->
    <div class="section">
      <h2>📸 キャプチャ</h2>
      <button id="captureCurrentPage" class="btn btn-primary btn-compact">
        現在のページ
      </button>
      <button id="captureRange" class="btn btn-primary btn-compact">
        指定ページ
      </button>
      <input
        type="text"
        id="pageRange"
        placeholder="例: 1-10, 15, 20-30"
        class="input input-compact"
      />
      <button id="captureAllPages" class="btn btn-danger btn-compact">
        全ページ
      </button>
      <p class="warning">⚠️ 全ページは時間がかかる場合があります</p>
    </div>

    <!-- 進捗表示（キャンセルボタンのみ） -->
    <div id="progress" class="progress-container hidden">
      <button id="cancelCapture" class="btn btn-secondary">キャンセル</button>
    </div>

    <!-- オプション設定 -->
    <div class="section">
      <h2>⚙️ 設定</h2>
      <label class="setting-label-block">
        <span>保存フォルダ</span>
        <input
          type="text"
          id="saveFolderName"
          placeholder="保存先のフォルダ名"
          class="input input-compact"
        />
      </label>
      <label class="setting-label-block">
        <span>めくり間隔(ms)</span>
        <input
          type="number"
          id="pageDelay"
          value="1500"
          min="500"
          max="5000"
          step="100"
          class="input input-compact"
        />
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="convertToPdf" />
        <span>PDFに変換</span>
      </label>
    </div>

    <!-- フッター -->
    <div class="footer">
      <p>v1.1 | Kindle Cloud Reader</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
